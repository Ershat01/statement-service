spring:
  application:
    name: statement-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/reconciliation
    username: recon
    password: recon
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    kz.recon: DEBUG
